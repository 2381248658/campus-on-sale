name: 校园惠自动部署（纯前端稳定版）
on:
    push:
        branches: [main]

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            # 1. 拉取GitHub代码
            - uses: actions/checkout@v4

            # 2. 安装Node环境
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            # 3. 安装前端依赖 + 打包
            - name: 安装依赖并打包
              working-directory: ./frontend
              run: |
                  npm install
                  npm run build

            # 4. 自动上传dist到服务器（核心功能）
            - name: 部署前端到服务器
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ubuntu
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  # 源文件：前端打包后的dist
                  source: './frontend/dist'
                  # 目标路径：你的服务器前端目录
                  target: '/www/wwwroot/campus-on-sale/'
                  # 覆盖旧文件
                  rm: true
